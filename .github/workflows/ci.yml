name: "CI"
on: [push, pull_request]

jobs:
  bats:
    name: bats
    runs-on: ubuntu-latest
    steps:

      - name: Check out code
        uses: actions/checkout@v7

      - name: Setup bats
        uses: bats-core/bats-action@4.0.0
        with:
            bats-version: 1.11.0
            support-path: "${{ github.workspace }}/bats/bats-support"
            assert-path: "${{ github.workspace }}/bats/bats-assert"
            detik-path: "${{ github.workspace }}/bats/bats-detik"
            file-path: "${{ github.workspace }}/bats/bats-file"

      - name: Configure git (user name)
        run: git config --global user.name "Decomposer (CI)"

      - name: Configure git (user email)
        run: git config --global user.email "actions@php-decomposer.org"

      - name: Configure git (default branch)
        run: git config --global init.defaultBranch master

      - name: Run bats
        run: bats --print-output-on-failure -r tests
        env:
          BATS_LIB_PATH: ${{ github.workspace }}/bats

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Shellcheck
        continue-on-error: true
        run: |
          # shellcheck disable=SC2086
          # exclude non-shell files (e.g. *.jq) from shellcheck
          files=$(find share/ libexec/ -type f ! -name '*.jq')
          # shellcheck disable=SC2086
          shellcheck --format=checkstyle --shell=bash bin/decomposer $files > shellcheck-result.xml

      - uses: staabm/annotate-pull-request-from-checkstyle-action@v1
        with:
          files: shellcheck-result.xml
          notices-as-warnings: true # optional

  jsonschema:
    name: jsonschema
    runs-on: ubuntu-latest
    env:
      DECOMPOSER_TARGET_DIR: /tmp/decomposer
    steps:

      - name: Check out code
        uses: actions/checkout@v7

      - name: Install JSON schema
        run: pip install check-jsonschema

      - name: Clone a project that uses Decomposer
        run: git clone https://github.com/lunr-php/lunr.git /tmp/lunr

      - name: Create target dir
        run: mkdir -p "$DECOMPOSER_TARGET_DIR"

      - name: Install libraries
        working-directory: /tmp/lunr
        run: ${{ github.workspace }}/bin/decomposer install

      - name: Generate SBOM
        working-directory: /tmp/lunr
        run: ${{ github.workspace }}/bin/decomposer sbom

      - name: Validate
        run: check-jsonschema --schemafile https://raw.githubusercontent.com/spdx/spdx-spec/v2.3/schemas/spdx-schema.json /tmp/lunr/decomposer.sbom.json
